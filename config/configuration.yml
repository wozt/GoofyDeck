brightness: 100

global:
  disable_wallpapers: false

sleep:
  dim_brightness: 10
  dim_timeout: 600
  sleep_timeout: 86400

wallpaper:
  path: "mymedia/wallpapers/valley16bits.png"
  quality: 60
  magnify: 100
  dithering: yes

system_buttons:
  $page.back:
    position: 11
  $page.previous:
    position: 12
  $page.next:
    position: 13
presets:
  $nav:
    icon_background_color: transparent
    icon_border_color: FFFFFF
    icon_border_radius: 12
    icon_border_size: 128
    icon_border_width: 4
    icon_brightness: 99
    icon_color: FFFFFF
    icon_offset: 0,0
    icon_padding: 0
    icon_size: 120
  base_button:
    icon_background_color: transparent
    icon_border_radius: 12
    icon_color: FFFFFF
    icon_size: 128
  cmd_button:
    icon_background_color: transparent
    icon_border_radius: 12
    icon_color: FFFFFF
    icon_size: 128
    text_align: center
    text_color: 00FF00
    text_font: dustismo_bold.ttf
    text_offset: 0,0
    text_size: 50
  host_folder:
    icon_background_color: transparent
    icon_border_color: EEA0A9
    icon_border_radius: 12
    icon_border_size: 128
    icon_border_width: 4
    icon_color: FFFFFF
    icon_offset: 0,0
    icon_padding: 0
    icon_size: 126
  light_off:
    icon: "mdi:lightbulb-outline"
    icon_background_color: transparent
    icon_color: 333333
  light_on:
    icon: "mdi:lightbulb"
    icon_background_color: transparent
    icon_color: FFD700
  room_folder:
    icon_background_color: transparent
    icon_border_color: FFFFFF
    icon_border_radius: 12
    icon_border_size: 128
    icon_border_width: 4
    icon_color: FFFFFF
    icon_offset: 0,0
    icon_padding: 0
    icon_size: 126
  settings_folder:
    icon_background_color: transparent
    icon_border_color: 44EB22
    icon_border_radius: 12
    icon_border_size: 128
    icon_border_width: 4
    icon_color: FFFFFF
    icon_offset: 0,0
    icon_padding: 0
    icon_size: 126
pages:
  $root:
    wallpaper:
      path: "mymedia/wallpapers/neigesombre16bits.png"
      quality: 56
      magnify: 100
      dithering: yes
    buttons:
      - name: "Salon"
        presets: [room_folder]
        icon: mdi:sofa
        tap_action:
          action: $page.go_to
          data: "salon"
      - name: "cuisine"
        presets: [room_folder]
        icon: mdi:chef-hat
        tap_action:
          action: $page.go_to
          data: "cuisine"
      - name: "chambre"
        presets: [room_folder]
        icon: mdi:bed
        tap_action:
          action: $page.go_to
          data: "chambre"

      - name: "Debian PC"
        presets:
          - host_folder
        icon: mdi:server-minus
        tap_action:
          action: $page.go_to
          data: debian_pc
      - name: "Debian miniPC"
        presets:
          - host_folder
        icon: mdi:server-minus
        tap_action:
          action: $page.go_to
          data: debian_minipc
      - name: "VidéoProj"
        presets:
          - host_folder
        icon: mdi:projector
        tap_action:
          action: $page.go_to
          data: video_projector
      - name: "pi4"
        presets:
          - host_folder
        icon: mdi:raspberry-pi
        tap_action:
          action: $page.go_to
          data: pi4
      - name: "pi5"
        presets:
          - host_folder
        icon: mdi:raspberry-pi
        tap_action:
          action: $page.go_to
          data: pi5
      - name: ""
      - name: ""
      - name: "Apps"
        presets: [room_folder]
        icon: mdi:apps
        tap_action:
          action: $page.go_to
          data: apps
      - name: "settings"
        presets:
          - settings_folder
        icon: mdi:cog
        tap_action:
          action: $page.go_to
          data: settings
  salon:
    wallpaper:
      path: "mymedia/wallpapers/pinefluid.png"
      quality: 70
      magnify: 100
      dithering: yes
    buttons:
      - name: "Temperature"
        entity_id: sensor.tz3000_utwgoauk_snzb_02_temperature
        presets: [cmd_button,base_button]
      - name: "Lampe droite"
        entity_id: light.lampe_droite
        presets: [base_button]
        tap_action:
          action: light.toggle
        hold_action:
          action: light.toggle
        longhold_action:
          action: light.toggle
        released_action:
          action: light.toggle
        states:
          "on":
            name: "LD ON"
            presets: [light_on]
          "off":
            name: "LD OFF"
            presets: [light_off]
      - name: "Lampe gauche"
        entity_id: light.lampe_gauche
        presets: [base_button]
        tap_action:
          action: light.toggle
        states:
          "on":
            name: "LG ON"
            presets: [light_on]
          "off":
            name: "LG OFF"
            presets: [light_off]
      - name: "Lampe escalier"
        entity_id: light.lampe_escalier
        presets: [base_button]
        tap_action:
          action: light.toggle
        states:
          "on":
            name: "LE ON"
            presets: [light_on]
          "off":
            name: "LE OFF"
            presets: [light_off]
      - name: "Écrans Salon"
        entity_id: script.eteint_les_ecrans_du_salon
        presets: [base_button]
        icon: mdi:monitor
        tap_action:
          action: script.eteint_les_ecrans_du_salon
  cuisine:
    buttons:
      - name: "Néon du fond"
        entity_id: switch.er_lu_kai_guan_switch_1
        presets: [base_button]
        tap_action:
          action: switch.toggle
        states:
          "on":
            name: "NF ON"
            presets:
              - light_on
          "off":
            name: "NF OFF"
            presets:
              - light_off

      - name: "Néon droite"
        entity_id: switch.er_lu_kai_guan_switch_2
        presets:
          - base_button
        tap_action:
          action: switch.toggle
        states:
          "on":
            name: "ND ON"
            presets:
              - light_on
          "off":
            name: "ND OFF"
            presets:
              - light_off
  chambre:
    buttons:
      - name: "Temperature chambre"
        entity_id: sensor.tz3000_utwgoauk_snzb_02_temperature
        presets: [cmd_button,base_button]
      - name: "Lampe droite de la chambre"
        entity_id: light.lampe_droite_de_la_chambre
        presets:
          - base_button
        tap_action:
          action: light.toggle
        states:
          "on":
            name: "LDG ON"
            presets:
              - light_on
          "off":
            name: "LDG OFF"
            presets:
              - light_off
      - name: "Lampe gauche de la chambre"
        entity_id: light.lampe_gauche_de_la_chambre
        presets: [base_button]
        tap_action:
          action: light.toggle
        states:
          "on":
            name: "LDG ON"
            presets:
              - light_on
          "off":
            name: "LDG OFF"
            presets:
              - light_off
  debian_pc:
    buttons:
      - name: "reboot"
        entity_id: script.reboot_debian_pc
        presets:
          - base_button
        icon: mdi:restart
        tap_action:
          action: script.reboot_debian_pc
      - name: "poweroff"
        entity_id: script.power_off_debian_pc
        presets:
          - base_button

        icon: mdi:power
        tap_action:
          action: script.power_off_debian_pc 
      - name: "Firefox"
        presets:
          - base_button
        icon: url:https://upload.wikimedia.org/wikipedia/commons/e/e7/Firefox_logo%2C_2019.png
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/scripts/display0_launcher.sh firefox"
      - name: "Steam"
        presets:
          - base_button
        icon: url:https://upload.wikimedia.org/wikipedia/commons/c/c1/Steam_Logo.png
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/scripts/display0_launcher.sh steam"
      - name: "Discord"
        presets:
          - base_button
        icon: url:https://upload.wikimedia.org/wikipedia/fr/4/4f/Discord_Logo_sans_texte.svg
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/scripts/display0_launcher.sh discord"
      - name: "OBS"
        presets:
          - base_button
        icon: url:https://upload.wikimedia.org/wikipedia/commons/archive/1/13/20180807124923%21OBS_Studio_logo.png
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/scripts/display0_launcher.sh '/usr/bin/flatpak run --branch=stable --arch=x86_64 --command=obs com.obsproject.Studio'"
      - name: "QpwGraph"
        presets:
          - base_button
        icon: url:https://dl.flathub.org/media/org/rncbc/qpwgraph/428d4c49aeea9e6fdbfd0d3e7e380970/icons/128x128@2/org.rncbc.qpwgraph.png
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/scripts/display0_launcher.sh qpwgraph"                 
  debian_minipc:
    buttons:
      - name: "reboot"
        entity_id: script.reboot_minipc_server
        presets:
          - base_button
        icon: mdi:restart
        tap_action:
          action: script.reboot_minipc_server
      - name: "poweroff"
        entity_id: script.power_off_minipc_server
        presets:
          - base_button
        icon: mdi:power
        tap_action:
          action: script.power_off_minipc_server
  video_projector:
    buttons:
      - name: "reboot"
        entity_id: script.reboot_rpi5
        presets:
          - base_button
        icon: mdi:restart
        tap_action:
          action: script.reboot_rpi5
      - name: "poweroff"
        entity_id: script.power_off_rpi5
        presets:
          - base_button
        icon: mdi:power
        tap_action:
          action: script.power_off_rpi5
  pi4:
    buttons:
      - name: "reboot"
        entity_id: script.reboot_rpi4
        presets:
          - base_button
        icon: mdi:restart
        tap_action:
          action: script.reboot_rpi4
      - name: "poweroff"
        entity_id: script.power_off_rpi4
        presets:
          - base_button
        icon: mdi:power
        tap_action:
          action: script.power_off_rpi4
  pi5:
    buttons:
      - name: "reboot"
        entity_id: script.reboot_rpi5
        presets:
          - base_button
        icon: mdi:restart
        tap_action:
          action: script.reboot_rpi5
      - name: "poweroff"
        entity_id: script.power_off_rpi5
        presets:
          - base_button
        icon: mdi:power
        tap_action:
          action: script.power_off_rpi5
  settings:
    wallpaper:
      path: "mymedia/wallpapers/settings16bits.png"
      quality: 60
      magnify: 100
      dithering: yes
    buttons:
      - name: "RAM cache"
        presets: [cmd_button]
        icon: mdi:memory
        tap_action:
          action: $cmd.exec_text
          data:
            cmd: "assets/scripts/clear_cache_ram.sh --text"
            trim: no
            max_len: 32
        longhold_action:
          actions:
            - action: $cmd.exec
              data:
                cmd: "assets/scripts/clear_cache_ram.sh --clear"
            - action: $cmd.text_clear
      - name: "DISK cache"
        presets: [cmd_button]
        icon: mdi:database
        tap_action:
          action: $cmd.exec_text
          data:
            cmd: "assets/scripts/clear_cache.sh --text"
            trim: no
            max_len: 32
        longhold_action:
          actions:
            - action: $cmd.exec
              data:
                cmd: "assets/scripts/clear_cache.sh --clear"
            - action: $cmd.text_clear
      - name: "Miniapp cache"
        presets: [cmd_button]
        icon: mdi:apps
        tap_action:
          action: $cmd.exec_text
          data:
            cmd: "assets/scripts/clear_miniapp_cache.sh --text"
            trim: no
            max_len: 32
        longhold_action:
          actions:
            - action: $cmd.exec
              data:
                cmd: "assets/scripts/clear_miniapp_cache.sh --clear"
            - action: $cmd.text_clear
      - name: "Wallpaper cache"
        presets: [cmd_button]
        icon: mdi:image
        tap_action:
          action: $cmd.exec_text
          data:
            cmd: "assets/scripts/clear_wallpaper_cache.sh --text"
            trim: no
            max_len: 32
        longhold_action:
          actions:
            - action: $cmd.exec
              data:
                cmd: "assets/scripts/clear_wallpaper_cache.sh --clear"
            - action: $cmd.text_clear
  apps:
    buttons:
      - name: "Videos"
        presets: [cmd_button]
        icon: mdi:movie-open
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/miniapp/video_miniapp.sh"
      - name: "Games"
        presets: [cmd_button]
        icon: mdi:controller-classic
        tap_action:
          action: $page.go_to
          data: games

  games:
    buttons:
      - name: "TicTacToe"
        presets: [cmd_button]
        icon: mdi:gamepad-variant
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/miniapp/tictactoe_miniapp.sh"
      - name: "2048"
        presets: [cmd_button]
        icon: mdi:numeric-8-box-outline
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/miniapp/2048_miniapp.sh"
      - name: "Simon"
        presets: [cmd_button]
        icon: mdi:gesture-tap
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/miniapp/simon_miniapp.sh"
      - name: "Mastermind"
        presets: [cmd_button]
        icon: mdi:bullseye
        tap_action:
          action: $cmd.exec
          data:
            cmd: "mymedia/miniapp/mastermind_miniapp.sh"
